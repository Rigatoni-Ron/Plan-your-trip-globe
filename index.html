<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan Your Trip — Globe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:     #D6D9DD;
      --border: rgba(0,0,0,0.10);
      --text:   #1A1D24;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
      width: 100%;
      max-width: 1100px;
    }

    /* Connected two-panel wrapper */
    .panels-wrapper {
      display: flex;
      align-self: center;
      width: auto;
      height: 640px;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: width .6s cubic-bezier(.22,1,.36,1);
    }

    /* Art panel — globe */
    .art-panel {
      position: relative;
      background: radial-gradient(ellipse at 50% 45%, #E4E7EB 0%, #C8CCD2 100%);
      overflow: hidden;
      flex: 0 0 640px;
      height: 100%;
    }
    .panels-wrapper.has-trip .art-panel {
      border-right: 1px solid var(--border);
    }
    #art-canvas {
      position:absolute; inset:0;
      width:100%; height:100%;
    }
    .art-panel::after {
      content:'';
      position:absolute; inset:0;
      background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(214,217,221,0.85) 100%);
      pointer-events:none;
    }

    /* Side panel — flights */
    .side-panel {
      flex: 0 0 0;
      width: 0;
      display: flex;
      flex-direction: column;
      background: rgba(235,237,241,0.6);
      min-width: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: flex-basis .6s cubic-bezier(.22,1,.36,1), width .6s cubic-bezier(.22,1,.36,1), opacity .35s ease .15s;
    }
    .side-panel.visible {
      flex: 0 0 440px;
      width: 440px;
      opacity: 1;
      pointer-events: auto;
    }
    .side-panel > .side-header,
    .side-panel > .cards-list,
    .side-panel > .side-footer {
      transition: opacity .3s ease, transform .35s cubic-bezier(.4,0,.2,1);
    }
    .side-panel.evaporating > .side-header,
    .side-panel.evaporating > .cards-list,
    .side-panel.evaporating > .side-footer {
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
    }
    .side-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .side-header-reset {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(30,45,80,0.55);
      background: transparent;
      border: 1px solid rgba(30,45,80,0.22);
      border-radius: 6px;
      padding: 4px 9px;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }
    .side-header-reset:hover {
      background: rgba(15,20,40,0.08);
      color: rgba(15,20,40,0.85);
      border-color: rgba(15,20,40,0.4);
    }
    .side-header-title {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: rgba(15,20,40,0.85);
    }
    .side-header-sub {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: .08em;
      color: rgba(30,45,80,0.45);
      text-transform: uppercase;
    }
    .cards-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cards-list::-webkit-scrollbar { width: 4px; }
    .cards-list::-webkit-scrollbar-track { background: transparent; }
    .cards-list::-webkit-scrollbar-thumb { background: rgba(30,45,80,0.15); border-radius: 2px; }
    .cards-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 100%;
      color: rgba(30,45,80,0.3);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-align: center;
      padding: 20px;
      line-height: 1.8;
    }
    .cards-empty svg { opacity: .25; }

    /* Flight card */
    .flight-card {
      background: rgb(56, 59, 70);
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      animation: cardIn .35s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(8px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .fc-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .fc-send {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(235,238,245,0.55);
      overflow: hidden;
    }
    .fc-to {
      transition: opacity .4s ease, transform .5s cubic-bezier(.22,1,.36,1);
    }
    .flight-card.placeholder .fc-to {
      opacity: 0;
      transform: translateY(8px);
    }
    .fc-reveal {
      overflow: hidden;
      max-height: 60px;
      opacity: 1;
      transition: max-height .55s cubic-bezier(.22,1,.36,1),
                  opacity .4s ease,
                  margin-top .55s cubic-bezier(.22,1,.36,1),
                  transform .55s cubic-bezier(.22,1,.36,1);
    }
    .flight-card.placeholder .fc-reveal {
      max-height: 0;
      opacity: 0;
      margin-top: -9px;
      transform: translateY(8px);
    }
    .flight-card.placeholder .fc-send { opacity: 0; }
    .flight-card:not(.placeholder) .fc-send svg {
      animation: fcSend 1.2s cubic-bezier(.5,0,.3,1) both;
    }
    @keyframes fcSend {
      0%   { transform: translateX(-6px); opacity: 0; }
      20%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateX(6px); opacity: 0; }
    }
    .fc-row.fc-row-price {
      margin: 4px -14px 0;
      padding: 10px 14px 0;
      border-top: 1px solid rgba(235,237,241,0.6);
    }
    .fc-city {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: rgba(235,238,245,0.95);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fc-sub {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: .07em;
      color: rgba(235,238,245,0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fc-time-group {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .fc-time {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: rgba(235,238,245,0.95);
    }
    .fc-date {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: .07em;
      color: rgba(235,238,245,0.5);
    }
    .fc-price {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: rgba(235,238,245,0.95);
      text-align: right;
    }

    /* Total cost footer */
    .side-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: rgba(228,231,235,0.5);
    }
    .side-footer-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(30,45,80,0.5);
    }
    .side-footer-total {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: rgba(10,15,35,0.9);
      letter-spacing: -.01em;
    }
    .side-footer-total.hidden { color: rgba(30,45,80,0.25); font-weight: 400; font-size: 12px; }

    /* Search bar (beneath panels) */
    #globe-search {
      position:relative;
      width:100%; max-width:440px;
      align-self: center;
      display:flex; flex-direction:column-reverse; gap:6px;
      z-index:5;
    }
    #globe-suggestions {
      list-style:none; margin:0; padding:4px 0;
      background:rgba(228,231,235,0.96); border:1px solid rgba(30,45,80,0.18);
      border-radius:9px; overflow:hidden; overflow-y:auto;
      max-height:148px; backdrop-filter:blur(14px);
      position:absolute; left:0; right:0; bottom:calc(100% + 6px);
    }
    #globe-suggestions:empty { display:none; }
    #globe-suggestions li {
      padding:7px 14px;
      font-family:'Space Mono',monospace; font-size:10px;
      letter-spacing:.1em; text-transform:uppercase;
      color:rgba(30,45,80,0.65); cursor:pointer;
    }
    #globe-suggestions li:hover,
    #globe-suggestions li.active { background:rgba(30,45,80,0.08); color:rgba(15,20,40,0.95); }
    #globe-search-bar {
      display:flex; align-items:center; gap:8px;
      background:rgba(228,231,235,0.6); border:1px solid rgba(30,45,80,0.22);
      border-radius:10px; padding:8px 8px 8px 14px;
      backdrop-filter:blur(14px);
    }
    #globe-search-bar.pulse {
      animation: searchPulse 4.5s ease-in-out infinite;
    }
    @keyframes searchPulse {
      0%, 100% { box-shadow: 0 0 10px 0 rgba(15,20,40,0.14); border-color: rgba(15,20,40,0.28); transform: scale(1);    }
      50%      { box-shadow: 0 0 20px 4px rgba(15,20,40,0.28); border-color: rgba(15,20,40,0.5);  transform: scale(1.015); }
    }
    #globe-search-input {
      flex:1; background:none; border:none; outline:none;
      font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.08em;
      color:#0F1428;
    }
    #globe-search-input::placeholder { color:rgba(30,45,80,0.4); }
    #globe-search-btn {
      background:rgba(15,20,40,0.88); border:1px solid rgba(15,20,40,0.95);
      color:rgba(228,231,235,0.95); border-radius:7px; padding:7px 13px;
      font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.07em;
      display:flex; align-items:center; gap:0; overflow:hidden;
      transition:background .3s, border-color .3s, color .3s, box-shadow .3s, padding .4s cubic-bezier(.4,0,.2,1);
    }
    #globe-search-btn:not(.off):hover { background:rgba(30,45,80,1); border-color:rgba(30,45,80,1); }

    #globe-search-btn .btn-text {
      display:inline-block; white-space:nowrap; overflow:hidden;
      max-width:160px; padding-right:7px;
      transition:max-width .4s cubic-bezier(.4,0,.2,1), padding-right .4s cubic-bezier(.4,0,.2,1), opacity .25s ease;
    }
    #globe-search-btn .btn-icon {
      display:flex; align-items:center; flex-shrink:0;
      max-width:20px; overflow:hidden;
      transition:max-width .4s cubic-bezier(.4,0,.2,1), opacity .25s ease;
    }
    #globe-search-btn .btn-dots {
      display:inline-flex; gap:1px; overflow:hidden;
      max-width:0; opacity:0;
      transition:max-width .4s cubic-bezier(.4,0,.2,1), opacity .25s ease;
    }

    #globe-search-btn.off {
      background:rgba(15,20,40,0.08); border-color:rgba(15,20,40,0.18);
      color:rgba(15,20,40,0.35); pointer-events:none;
    }
    #globe-search-btn.loading .btn-text { max-width:0; padding-right:0; opacity:0; }
    #globe-search-btn.loading .btn-icon { max-width:0; opacity:0; }
    #globe-search-btn.loading .btn-dots { max-width:40px; opacity:1; }
    #globe-search-btn.loading { padding:7px 11px; pointer-events:none;
      background:rgba(15,20,40,0.55); border-color:rgba(15,20,40,0.65);
      color:rgba(228,231,235,0.85); }

    @keyframes dotFade { 0%,100%{opacity:.15} 50%{opacity:1} }
    #globe-search-btn .ld { display:inline-block; animation:dotFade 1s ease-in-out infinite; }
    #globe-search-btn .ld:nth-child(2){animation-delay:.18s}
    #globe-search-btn .ld:nth-child(3){animation-delay:.36s}

    @keyframes btnAwake {
      0%   { box-shadow:0 0 0 0 rgba(30,45,80,0.55); }
      60%  { box-shadow:0 0 0 7px rgba(30,45,80,0); }
      100% { box-shadow:0 0 0 0 rgba(30,45,80,0); }
    }
    #globe-search-btn.awake { animation:btnAwake .55s ease-out forwards; }
  </style>
</head>
<body>

  <div class="stage">
    <div class="panels-wrapper">
      <!-- Globe -->
      <div class="art-panel">
        <canvas id="art-canvas"></canvas>
      </div>
      <!-- Flights side panel -->
      <div class="side-panel">
        <div class="side-header">
          <span class="side-header-title">Your journey</span>
          <button type="button" class="side-header-reset" id="side-reset">Reset</button>
        </div>
        <div class="cards-list" id="cards-list">
          <div class="cards-empty" id="cards-empty">
            <svg xmlns="http://www.w3.org/2000/svg" height="32" viewBox="0 -960 960 960" width="32" fill="currentColor"><path d="M440-80v-80H160v-80h280v-480L80-520v-100l360-200v-60q0-33 23.5-56.5T520-960q33 0 56.5 23.5T600-880v60l360 200v100L600-720v480h280v80H440Z"/></svg>
            Plot your first trip to<br>see flights here
          </div>
        </div>
        <div class="side-footer">
          <span class="side-footer-label">Cheapest route</span>
          <span class="side-footer-total hidden" id="side-total">—</span>
        </div>
      </div>
    </div>

    <!-- Search -->
    <div id="globe-search">
      <ul id="globe-suggestions"></ul>
      <div id="globe-search-bar" class="pulse">
        <input id="globe-search-input" type="text" placeholder="Search the city you live in" autocomplete="off" spellcheck="false" />
        <button id="globe-search-btn" class="off">
          <span class="btn-text">Plot home</span>
          <span class="btn-icon"><svg xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 -960 960 960" width="16" fill="currentColor"><path d="M647-440H160v-80h487L423-744l57-56 320 320-320 320-57-56 224-224Z"/></svg></span>
          <span class="btn-dots" aria-hidden="true"><span class="ld">·</span><span class="ld">·</span><span class="ld">·</span></span>
        </button>
      </div>
    </div>
  </div>

  <script>
    /* ── Globe (Canvas 2D + real land data) ── */
    (function () {
      const canvas = document.getElementById('art-canvas');
      const ctx    = canvas.getContext('2d');
      let W = 0, H = 0;

      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr  = devicePixelRatio;
        W = canvas.width  = Math.round(rect.width  * dpr);
        H = canvas.height = Math.round(rect.height * dpr);
        canvas.style.width  = rect.width  + 'px';
        canvas.style.height = rect.height + 'px';
      }
      window.addEventListener('resize', resizeCanvas);
      if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(canvas.parentElement);
      resizeCanvas();

      /* ── Land texture (equirectangular map — same source as COBE) ── */
      const LAND_B64 = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAACAAQAAAADMzoqnAAAECklEQVR42u3VsW4jRRzH8d94gzfF4Q0VQaC4vBLTRTp0mze4ggfAPAE5XQEFsGNAVIjwBrmW7h7gJE+giKjyABTZE4g06LKJETdRJvtD65kdz6yduKABiW+TVfzRf2bXYxtcE/59YJCz6YdbgQF6ACSRrwYKYImmh5PbwOewlV3wlQNbAN6SEExjUOO+BU0aCSnxReHABUlK4YFQeJeUT3da8IIkZ6NGoSnFY5KsMoVzMKfECUnqxgPYRArarmUCndHwzIEaQEpg5xVdBXROl8mpAQx5dUgPiHoYAAkg5w3JABR06byGAVgcRGAz5bznj6phBQNRFwyqgdxebH6gshJAesWoFhgYpApAFoG8BIZ/fEhSox5jDjQXmV0Ar5XJfAIrALi3URVs09gHIL4XJCkLC5LH9JWiArABFCSrQjdgkBzRJ0WJeUOSNyQAfJJwUSWUBRlJQ8oGHATACGlBynnzy2kEYLNjrxouigD8BZcgOeVPqh12RtufaCN5wCPVDpvQ9lsIrqndsJtDcWqBCpf4hWN7OdWHBw58FwIaNOU/n1TpMW2DFaD48cmr4185T8NHkpUFX749pQPVdgRKC/DGoQPVeAEKv+WHvY8OOWNTPRp5kHuwSf8wzXtVBKR7YwEH9H3lQUaypUfSATOALyVNu5vZJW31Bnx98nkLfDUWJaz6ixvm+RIQRdl3kmRxxiaDoGnZW4CpPfkaQadlcPim1xOSvETQo7Lv75enVAXJ3xGUlony4KQBBWUM1NiDc6qhyS8RgQs18OCMMtPDaAUIyg0PZkRWDqs+wnKJBTDI1Js6BolegOsKmUxNDBAAKqQyMQmidhegBlLZ+wwKYdv5M/8x1khkb1cgKqP2H+MKyV5vS+whrE8DQDgAlUAoRBX056EElJCjJVACeJBZgNfVp+iCCm4RBWCgKsRxASSA9KgDhDtCiTuMyfHsKXzhC6wNAIjjWb8LKAOA2ctk3FmCOlgKFy8f1N0JJtgsxinYnVAHt4t3gPzZXSCTyCWCQmBT91QE3B5yarSN40dNHYPka4TlDhTUI8zLvl0JSL3vZn6DsCFZOeB2yROEpR68sECQQA++xIGCR2X7DwlEoLRgUrZrqlUg50S1uy43YqDcN6UFBVkhAjWiCV2Q0jgQPdplMKxvBXodcOfAwJYvgdL+1etA1YJJfBcZlQV7sO1i2gHoNiyxtQ5sBsCgWyoxCHiFFd2L5nUTCqMAqGUgsQ9f5kCcCiZgRYkMgMTd5WsB1rTzj0Em14BE4r+QxN1lCEsVur2PoF5Wbg8RJXR4djgvBgauhLywoEZQrt1KKRdVS4CdlJ8qafyP+9KIj/nE/d7kKwH9jgS72e9DV+kvfTWgct4ZyP8Byb8BPG7MaaIIkAQAAAAASUVORK5CYII=';

      /* Toronto coords */
      const TOR_LAT = 43.65 * Math.PI / 180;
      const TOR_LON = -79.38 * Math.PI / 180;
      const toronto = [Math.cos(TOR_LAT)*Math.cos(TOR_LON), Math.sin(TOR_LAT), Math.cos(TOR_LAT)*Math.sin(TOR_LON)];

      /* Rotation helpers */
      function rY(v,a){ return [v[0]*Math.cos(a)+v[2]*Math.sin(a), v[1], -v[0]*Math.sin(a)+v[2]*Math.cos(a)]; }
      function rX(v,a){ return [v[0], v[1]*Math.cos(a)-v[2]*Math.sin(a), v[1]*Math.sin(a)+v[2]*Math.cos(a)]; }
      function orth(v,sc){ return [W/2-v[0]*sc, H/2-v[1]*sc]; }

      const INIT_Y = -2.957;
      const INIT_X = 0.42;
      let t = 0;
      let spinTarget   = null;
      const TRIP_MS    = 1500;

      /* Hover */
      let mouseX = -9999, mouseY = -9999;
      canvas.addEventListener('mousemove', e => {
        const r = canvas.getBoundingClientRect(), dpr = devicePixelRatio;
        mouseX = (e.clientX - r.left) * dpr;
        mouseY = (e.clientY - r.top)  * dpr;
      });
      canvas.addEventListener('mouseleave', () => { mouseX = -9999; mouseY = -9999; });

      /* Noise particles */
      const NOISE = Array.from({length:65}, () => ({x:0,y:0,vx:0,vy:0,life:0,maxLife:1,r:1}));

      /* Satellites */
      const SATS = [
        { u:[1,0,0],         v:[0,0.5,0.866],  speed:1.80, phase:0.0, orb:1.22 },
        { u:[0,1,0],         v:[0.866,0,0.5],  speed:2.50, phase:2.1, orb:1.28 },
        { u:[0.707,0.707,0], v:[0,0,1],        speed:1.35, phase:4.2, orb:1.18 },
      ];

      /* ── Cities + flight paths ── */
      function ll(lat, lon) {
        const lr = lat * Math.PI / 180, lo = lon * Math.PI / 180;
        return [Math.cos(lr)*Math.cos(lo), Math.sin(lr), Math.cos(lr)*Math.sin(lo)];
      }
      /* Plotted state — built up by the user via search */
      let home  = null;        // { name, key, v, plottedAt }
      let trips = [];          // [{ name, key, v, plottedAt }, …]
      let plotMode = 'home';   // 'home' → first plot, then 'trip'

      /* Spherical linear interpolation */
      function slerp(a, b, t) {
        const dot = Math.max(-1, Math.min(1, a[0]*b[0]+a[1]*b[1]+a[2]*b[2]));
        const th  = Math.acos(dot);
        if (th < 0.0001) return [a[0],a[1],a[2]];
        const s = Math.sin(th);
        const sa = Math.sin((1-t)*th)/s, sb = Math.sin(t*th)/s;
        return [sa*a[0]+sb*b[0], sa*a[1]+sb*b[1], sa*a[2]+sb*b[2]];
      }

      /* ── City database (major world cities) ── */
      function city(name, lat, lon) { return { name, key: name.toUpperCase(), v: ll(lat, lon) }; }

      function iataFor(name) {
        return IATA[name.toUpperCase()] || name.toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);
      }

      /* Deterministic "flight" data for a leg */
      const AIRLINES = [
        { name:'Air Canada',        code:'AC' },
        { name:'Delta',             code:'DL' },
        { name:'United',            code:'UA' },
        { name:'American',          code:'AA' },
        { name:'Lufthansa',         code:'LH' },
        { name:'British Airways',   code:'BA' },
        { name:'Air France',        code:'AF' },
        { name:'KLM',               code:'KL' },
        { name:'Emirates',          code:'EK' },
        { name:'Qatar Airways',     code:'QR' },
        { name:'Singapore Airlines',code:'SQ' },
        { name:'ANA',               code:'NH' },
        { name:'Turkish Airlines',  code:'TK' },
        { name:'Iberia',            code:'IB' },
      ];
      function hash(str) {
        let h = 2166136261;
        for (let i=0;i<str.length;i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
        return (h >>> 0);
      }
      function fmtTime(mins) {
        mins = ((mins % 1440) + 1440) % 1440;
        const h = Math.floor(mins/60), m = mins%60;
        return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
      }
      function computeFlight(from, to) {
        const dot = Math.max(-1, Math.min(1, from.v[0]*to.v[0]+from.v[1]*to.v[1]+from.v[2]*to.v[2]));
        const distKm = Math.acos(dot) * 6371;
        const durMin = Math.round(distKm / 820 * 60 + 45);
        const h = hash(from.key + '→' + to.key);
        const airline = AIRLINES[h % AIRLINES.length];
        const flightNum = 100 + ((h >> 8) % 1899);
        const takeoffMin = ((h >> 4) % 48) * 30; // half-hour increments
        const landingMin = takeoffMin + durMin;
        const dayOffset = Math.floor(landingMin / 1440);
        const price = Math.round(140 + distKm * 0.11 + ((h >> 12) % 80));
        return {
          airline, flightNum, distKm, durMin,
          takeoff: fmtTime(takeoffMin),
          landing: fmtTime(landingMin),
          dayOffset,
          price,
          fromIata: iataFor(from.name),
          toIata:   iataFor(to.name),
        };
      }

      /* Render flight cards in the side panel */
      function renderFlights() {
        const list   = document.getElementById('cards-list');
        const empty  = document.getElementById('cards-empty');
        const totalEl= document.getElementById('side-total');
        const panel  = document.querySelector('.side-panel');
        const wrap   = document.querySelector('.panels-wrapper');

        const showPanel = !!home;
        panel.classList.toggle('visible', showPanel);
        wrap.classList.toggle('has-trip', showPanel);

        if (!home) {
          list.innerHTML = '';
          list.appendChild(empty);
          totalEl.textContent = '—';
          totalEl.classList.add('hidden');
          return;
        }

        const emptyMsg = list.querySelector('.cards-empty');
        if (emptyMsg) emptyMsg.remove();

        const nodes = [home, ...trips];
        const entries = [];
        if (trips.length === 0) {
          entries.push({ from: home, to: null, flight: null });
        } else {
          for (let i=0; i<nodes.length-1; i++) {
            entries.push({ from: nodes[i], to: nodes[i+1], flight: computeFlight(nodes[i], nodes[i+1]) });
          }
        }

        const existing = new Map();
        list.querySelectorAll('.flight-card').forEach(el => existing.set(el.dataset.fromKey, el));
        const wantedKeys = new Set();

        entries.forEach((e, i) => {
          wantedKeys.add(e.from.key);
          let card = existing.get(e.from.key);
          if (!card) {
            card = document.createElement('div');
            card.className = 'flight-card placeholder';
            card.dataset.fromKey = e.from.key;
            card.innerHTML = `
              <div class="fc-row">
                <span class="fc-city fc-from"></span>
                <span class="fc-send" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18-8.5a.5.5 0 0 0 0-.904z"/><path d="M6 12h16"/></svg>
                </span>
                <span class="fc-city fc-to"></span>
              </div>
              <div class="fc-row fc-reveal">
                <span class="fc-sub fc-airline"></span>
                <span class="fc-sub fc-dur"></span>
              </div>
              <div class="fc-row fc-row-price fc-reveal">
                <span class="fc-time-group">
                  <span class="fc-time"></span>
                  <span class="fc-date"></span>
                </span>
                <span class="fc-price"></span>
              </div>
            `;
          }

          const fromEl = card.querySelector('.fc-from');
          fromEl.textContent = `${e.from.name} — ${iataFor(e.from.name)}`;
          fromEl.title = e.from.name;

          if (e.to && e.flight) {
            card.classList.remove('placeholder');
            const toEl = card.querySelector('.fc-to');
            toEl.textContent = e.to.name;
            toEl.title = e.to.name;
            const durStr = `${Math.floor(e.flight.durMin/60)}h ${String(e.flight.durMin%60).padStart(2,'0')}m`;
            card.querySelector('.fc-airline').textContent = `${e.flight.airline.name} — ${e.flight.airline.code} ${e.flight.flightNum}`;
            card.querySelector('.fc-dur').textContent = durStr;
            card.querySelector('.fc-time').textContent = e.flight.takeoff;
            const flightDate = new Date(Date.now() + (i + 1) * 7 * 86400000);
            card.querySelector('.fc-date').textContent = flightDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            card.querySelector('.fc-price').textContent = `$${e.flight.price.toLocaleString()}`;
          } else {
            card.classList.add('placeholder');
          }

          if (list.children[i] !== card) list.insertBefore(card, list.children[i] || null);
        });

        existing.forEach((el, key) => { if (!wantedKeys.has(key)) el.remove(); });

        const total = entries.reduce((s,e)=>s+(e.flight ? e.flight.price : 0), 0);
        if (total > 0) {
          totalEl.textContent = '$' + total.toLocaleString();
          totalEl.classList.remove('hidden');
        } else {
          totalEl.textContent = '—';
          totalEl.classList.add('hidden');
        }
      }

      /* Search UI wiring */
      (function () {
        const input   = document.getElementById('globe-search-input');
        const list    = document.getElementById('globe-suggestions');
        const btn     = document.getElementById('globe-search-btn');
        const btnText = btn.querySelector('.btn-text');
        const keys    = Object.keys(CITY_DB);

        function plottedKeys() {
          const s = new Set();
          if (home) s.add(home.key);
          for (const t of trips) s.add(t.key);
          return s;
        }

        function modePlaceholder() {
          return plotMode === 'home' ? 'Search the city you live in' : 'Where do you want to go?';
        }
        function modeButtonText() {
          return plotMode === 'home' ? 'Plot home' : 'Plot trip';
        }

        function refreshUiForMode() {
          input.placeholder = modePlaceholder();
          btnText.textContent = modeButtonText();
        }

        function setSuggestions(q) {
          list.innerHTML = '';
          if (!q) return;
          const taken = plottedKeys();
          const matches = keys
            .filter(k => k.startsWith(q) && !taken.has(k))
            .slice(0, 6);
          matches.forEach(key => {
            const display = CITY_DB[key].name;
            const li = document.createElement('li');
            li.textContent = display;
            li.addEventListener('mousedown', e => {
              e.preventDefault();
              input.value = display;
              list.innerHTML = '';
              syncBtnState();
            });
            list.appendChild(li);
          });
        }

        function isValidEntry() {
          const key = input.value.trim().toUpperCase();
          if (!CITY_DB[key]) return false;
          return !plottedKeys().has(key);
        }

        function syncBtnState() {
          const ok = isValidEntry();
          const wasOff = btn.classList.contains('off');
          if (ok) {
            btn.classList.remove('off');
            if (wasOff) {
              btn.classList.remove('awake');
              void btn.offsetWidth;
              btn.classList.add('awake');
            }
          } else {
            btn.classList.add('off');
            btn.classList.remove('awake');
          }
        }

        input.addEventListener('input', () => {
          setSuggestions(input.value.trim().toUpperCase());
          syncBtnState();
        });
        input.addEventListener('blur', () => {
          setTimeout(() => { list.innerHTML = ''; }, 150);
        });
        list.addEventListener('mousedown', () => { setTimeout(syncBtnState, 0); });

        btn.addEventListener('click', () => {
          if (btn.classList.contains('off') || btn.classList.contains('loading')) return;
          const key = input.value.trim().toUpperCase();
          const c   = CITY_DB[key];
          if (!c || plottedKeys().has(key)) {
            input.style.color = 'rgba(190,30,30,0.85)';
            setTimeout(() => { input.style.color = ''; }, 800);
            return;
          }
          list.innerHTML = '';
          input.value = '';
          btn.classList.remove('awake');

          const v = c.v;
          const destLon   = Math.atan2(v[2], v[0]);
          const angTarget = destLon - Math.PI / 2;
          const tTarget   = angTarget - INIT_Y;
          let   delta     = ((tTarget - t) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
          if (delta < 0.4) delta += Math.PI * 2;
          const now2 = Date.now();
          spinTarget = { from: t, to: t + delta, startMs: now2, duration: TRIP_MS };

          const node = { name: c.name, key: c.key, v, plottedAt: now2 };
          if (plotMode === 'home') {
            home = node;
            plotMode = 'trip';
            document.getElementById('globe-search-bar').classList.remove('pulse');
          } else {
            trips.push(node);
          }
          renderFlights();

          btn.classList.add('loading');
          setTimeout(() => {
            btn.classList.remove('loading');
            btn.classList.add('off');
            refreshUiForMode();
          }, TRIP_MS + 100);
        });

        function setActive(idx) {
          const items = list.querySelectorAll('li');
          if (!items.length) return;
          const n = items.length;
          const next = ((idx % n) + n) % n;
          items.forEach((el, i) => el.classList.toggle('active', i === next));
          items[next].scrollIntoView({ block: 'nearest' });
        }
        function activeIndex() {
          const items = Array.from(list.querySelectorAll('li'));
          return items.findIndex(el => el.classList.contains('active'));
        }

        input.addEventListener('keydown', e => {
          const items = list.querySelectorAll('li');
          if (e.key === 'ArrowDown' && items.length) {
            e.preventDefault();
            const cur = activeIndex();
            setActive(cur < 0 ? 0 : cur + 1);
          } else if (e.key === 'ArrowUp' && items.length) {
            e.preventDefault();
            const cur = activeIndex();
            setActive(cur < 0 ? items.length - 1 : cur - 1);
          } else if (e.key === 'Enter') {
            const cur = activeIndex();
            if (items.length && cur >= 0) {
              e.preventDefault();
              input.value = items[cur].textContent;
              list.innerHTML = '';
              syncBtnState();
              btn.click();
            } else {
              btn.click();
            }
          }
        });

        refreshUiForMode();

        document.getElementById('side-reset').addEventListener('click', () => {
          const panel = document.querySelector('.side-panel');
          if (!home || panel.classList.contains('evaporating')) return;
          panel.classList.add('evaporating');
          setTimeout(() => {
            home = null;
            trips.length = 0;
            plotMode = 'home';
            spinTarget = null;
            input.value = '';
            list.innerHTML = '';
            btn.classList.remove('awake','loading');
            btn.classList.add('off');
            document.getElementById('globe-search-bar').classList.add('pulse');
            refreshUiForMode();
            renderFlights();
            panel.classList.remove('evaporating');
          }, 380);
        });
      })();

      /* Load land texture → build globePts → start draw loop */
      const img = new Image();
      img.onload = function () {
        const off = document.createElement('canvas');
        off.width = img.width; off.height = img.height;
        const octx = off.getContext('2d');
        octx.drawImage(img, 0, 0);
        const pix = octx.getImageData(0, 0, img.width, img.height).data;
        const TW = img.width, TH = img.height;

        const globePts = [];
        for (let lat = -90; lat <= 90; lat += 1.8) {
          const latR = lat * Math.PI / 180;
          const cosL = Math.cos(latR);
          const nLon = Math.max(1, Math.round(200 * Math.abs(cosL)));
          for (let i = 0; i < nLon; i++) {
            const lon  = (i / nLon) * 360 - 180;
            const tx   = Math.min(TW - 1, Math.floor(((lon + 180) / 360) * TW));
            const ty   = Math.min(TH - 1, Math.floor((1 - (lat + 90) / 180) * TH));
            const brightness = pix[(ty * TW + tx) * 4];
            if (brightness > 60) {
              const lonR = lon * Math.PI / 180;
              globePts.push([cosL * Math.cos(lonR), Math.sin(latR), cosL * Math.sin(lonR)]);
            }
          }
        }

        (function draw() {
          if (W === 0 || H === 0) { requestAnimationFrame(draw); return; }
          ctx.clearRect(0, 0, W, H);
          if (spinTarget) {
            const prog  = Math.min(1, (Date.now() - spinTarget.startMs) / spinTarget.duration);
            const eased = 1 - Math.pow(1 - prog, 3);
            t = spinTarget.from + (spinTarget.to - spinTarget.from) * eased;
            if (prog >= 1) { t = spinTarget.to; spinTarget = null; }
          } else {
            t += 0.0022;
          }
          const dpr    = devicePixelRatio;
          const sc     = Math.min(W, H) * 0.33;
          const ang    = INIT_Y + t;
          const hoverR = 38 * dpr;
          function rotate(v) { return rX(rY(v, ang), INIT_X); }
          const rTor  = rotate(toronto);
          const torPt = orth(rTor, sc);

          /* Cursor glow */
          if (mouseX > 0) {
            const grd = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, hoverR * 1.4);
            grd.addColorStop(0,   'rgba(30,45,80,0.13)');
            grd.addColorStop(0.5, 'rgba(30,45,80,0.06)');
            grd.addColorStop(1,   'rgba(30,45,80,0)');
            ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
          }

          /* Land dots */
          for (const v of globePts) {
            const r = rotate(v);
            if (r[2] < 0) continue;
            const alpha = Math.pow(r[2], 0.55) * 0.78;
            const [px, py] = orth(r, sc);
            const dx = px - mouseX, dy = py - mouseY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const glow = mouseX > 0 ? Math.max(0, 1 - dist / hoverR) : 0;
            let renderX = px, renderY = py, rippleCrest = 0;
            if (mouseX > 0 && dist < hoverR * 3.2) {
              const env  = Math.max(0, 1 - dist / (hoverR * 2.8));
              const freq = 0.044 / dpr;
              const amp  = 28 * dpr * env;
              const w1   = Math.sin(dist * freq - t * 7.2);
              const w2   = Math.sin(dist * freq * 1.65 - t * 5.4 + 1.5) * 0.55;
              const w3   = Math.sin(dist * freq * 0.55 - t * 3.0 + 0.8) * 0.30;
              const disp = (w1 + w2 + w3) * amp;
              const nx = dist > 0.5 ? dx/dist : 0, ny = dist > 0.5 ? dy/dist : 0;
              renderX = px + nx * disp; renderY = py + ny * disp;
              rippleCrest = Math.max(0, disp) / (amp * 1.5 + 0.001);
            }
            const active = glow > 0.02 || rippleCrest > 0.08;
            if (active) {
              ctx.shadowBlur  = (10*glow + 7*rippleCrest) * dpr;
              ctx.shadowColor = `rgba(30,45,80,${Math.max(glow,rippleCrest)*0.6})`;
              ctx.fillStyle   = `rgba(15,20,40,${Math.min(1, alpha + glow*0.72 + rippleCrest*0.48)})`;
              ctx.beginPath(); ctx.arc(renderX, renderY, (1.15 + glow*1.4 + rippleCrest*0.9)*dpr, 0, Math.PI*2); ctx.fill();
              ctx.shadowBlur = 0;
            } else {
              ctx.fillStyle = `rgba(35,42,65,${alpha})`;
              ctx.beginPath(); ctx.arc(renderX, renderY, 1.15*dpr, 0, Math.PI*2); ctx.fill();
            }
          }

          /* Noise particles */
          for (const pt of NOISE) {
            pt.life--;
            if (pt.life <= 0) {
              const lat = (Math.random()-0.5)*Math.PI, lon = Math.random()*Math.PI*2;
              const sv  = [Math.cos(lat)*Math.cos(lon), Math.sin(lat), Math.cos(lat)*Math.sin(lon)];
              const rv  = rotate(sv);
              if (rv[2] < 0.08) { pt.life = 2; continue; }
              const [px,py] = orth(rv, sc);
              const spd = (0.28 + Math.random()*0.55)*dpr;
              const nx = px-W/2, ny = py-H/2, nm = Math.sqrt(nx*nx+ny*ny)+1;
              pt.x = px; pt.y = py;
              pt.vx = nx/nm*spd + (Math.random()-0.5)*0.18*dpr;
              pt.vy = ny/nm*spd + (Math.random()-0.5)*0.18*dpr;
              pt.maxLife = 55 + Math.random()*85; pt.life = pt.maxLife;
              pt.r = (0.45 + Math.random()*0.65)*dpr;
            }
            pt.x += pt.vx; pt.y += pt.vy;
            const prog = pt.life / pt.maxLife;
            const a = Math.min(prog*6,1)*prog*0.52;
            if (a > 0.01) {
              ctx.fillStyle = `rgba(40,50,75,${a.toFixed(3)})`;
              ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2); ctx.fill();
            }
          }

          /* Satellites */
          for (const s of SATS) {
            for (let tr = 5; tr >= 0; tr--) {
              const tt = t - tr*0.042;
              const angle = s.speed*tt*3.5 + s.phase;
              const pos = [
                (Math.cos(angle)*s.u[0]+Math.sin(angle)*s.v[0])*s.orb,
                (Math.cos(angle)*s.u[1]+Math.sin(angle)*s.v[1])*s.orb,
                (Math.cos(angle)*s.u[2]+Math.sin(angle)*s.v[2])*s.orb,
              ];
              const rp = rotate(pos);
              if (rp[2] < 0) continue;
              const [sx,sy] = orth(rp, sc);
              if (tr === 0) {
                ctx.shadowBlur = 11*dpr; ctx.shadowColor = 'rgba(30,45,80,0.6)';
                ctx.fillStyle  = 'rgba(15,20,40,0.95)';
                ctx.beginPath(); ctx.arc(sx, sy, 2.3*dpr, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
              } else {
                const frac = tr/6;
                ctx.fillStyle = `rgba(40,55,90,${((1-frac)*0.52).toFixed(3)})`;
                ctx.beginPath(); ctx.arc(sx, sy, ((1-frac)*1.5+0.4)*dpr, 0, Math.PI*2); ctx.fill();
              }
            }
          }

          /* ── Plotted route + markers ── */
          const now = Date.now();
          const ARC_N = 90;

          const allNodes = [];
          if (home) allNodes.push({ ...home, isHome:true });
          for (const trp of trips) allNodes.push({ ...trp, isHome:false });

          const MIN_LABEL_DIST = 38 * dpr;
          const drawnLabelPos  = [];
          function labelClear(x, y) {
            for (const [lx,ly] of drawnLabelPos) {
              const dx = x-lx, dy = y-ly;
              if (dx*dx+dy*dy < MIN_LABEL_DIST*MIN_LABEL_DIST) return false;
            }
            return true;
          }
          function drawPillLabel(text, x, y, alpha, isHome) {
            const fontSize = isHome ? 10*dpr : 8.5*dpr;
            ctx.font = `${fontSize}px "Space Mono",monospace`;
            const tw  = ctx.measureText(text).width;
            const ph  = fontSize * 1.25;
            const px  = 4*dpr, py = 3*dpr;
            ctx.fillStyle = `rgba(255,255,255,${alpha*0.88})`;
            const rx = x - px, ry = y - ph + py*0.5;
            const rw = tw + px*2, rh = ph + py;
            const br = 3*dpr;
            ctx.beginPath();
            ctx.moveTo(rx+br, ry);
            ctx.lineTo(rx+rw-br, ry); ctx.arcTo(rx+rw,ry, rx+rw,ry+br, br);
            ctx.lineTo(rx+rw, ry+rh-br); ctx.arcTo(rx+rw,ry+rh, rx+rw-br,ry+rh, br);
            ctx.lineTo(rx+br, ry+rh); ctx.arcTo(rx,ry+rh, rx,ry+rh-br, br);
            ctx.lineTo(rx, ry+br); ctx.arcTo(rx,ry, rx+br,ry, br);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = `rgba(15,20,40,${alpha*0.95})`;
            ctx.fillText(text, x, y);
          }

          /* Green dotted route — segments between consecutive plotted nodes */
          for (let si = 0; si < allNodes.length - 1; si++) {
            const a = allNodes[si].v;
            const b = allNodes[si + 1].v;
            const isLatest = si === allNodes.length - 2;
            const age = now - allNodes[si + 1].plottedAt;
            const rawProg = isLatest ? Math.min(1, age / TRIP_MS) : 1;
            const easedProg = 1 - Math.pow(1 - rawProg, 3);
            const arcLimit = Math.ceil(ARC_N * easedProg);
            if (arcLimit <= 0) continue;

            const dotAB = a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
            const arcAngle = Math.acos(Math.max(-1, Math.min(1, dotAB)));
            const lift = 0.06 + arcAngle * 0.14;

            ctx.setLineDash([5*dpr, 7*dpr]);
            ctx.lineWidth = 1.6 * dpr;
            ctx.lineJoin  = 'round';
            ctx.shadowBlur  = 7*dpr; ctx.shadowColor = 'rgba(40,140,70,0.45)';
            ctx.strokeStyle = 'rgba(35,130,65,0.85)';
            let drawing = false;
            ctx.beginPath();
            for (let i = 0; i <= arcLimit; i++) {
              const tt = i / ARC_N;
              const p  = slerp(a, b, tt);
              const el = 1 + lift * Math.sin(Math.PI * tt);
              const rv = rotate([p[0]*el, p[1]*el, p[2]*el]);
              if (rv[2] < 0.01) { if (drawing) { ctx.stroke(); ctx.beginPath(); drawing = false; } continue; }
              const [sx,sy] = orth(rv, sc);
              if (!drawing) { ctx.moveTo(sx,sy); drawing = true; } else ctx.lineTo(sx,sy);
            }
            if (drawing) ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.setLineDash([]);
          }

          /* Visibility list for markers */
          const visible = [];
          for (const node of allNodes) {
            const r = rotate(node.v);
            if (r[2] < 0.04) continue;
            const [cx,cy] = orth(r, sc);
            const baseAlpha = Math.min(1, (r[2]-0.04)*9);
            const age = now - node.plottedAt;
            const fadeIn = node.isHome
              ? Math.min(1, Math.max(0, (age - TRIP_MS*0.78) / (TRIP_MS*0.22)))
              : Math.min(1, Math.max(0, (age - TRIP_MS*0.78) / (TRIP_MS*0.22)));
            visible.push({ node, r, cx, cy, alpha: baseAlpha * fadeIn });
          }
          visible.sort((a,b) => b.r[2]-a.r[2]);

          for (const { node, cx, cy, alpha } of visible) {
            if (alpha <= 0.01) continue;
            if (node.isHome) {
              for (let wave = 0; wave < 2; wave++) {
                const phase = ((now + wave*1100) % 2400) / 2400;
                ctx.strokeStyle = `rgba(30,45,80,${(1-phase)*0.55*alpha})`;
                ctx.lineWidth   = 0.9*dpr;
                ctx.beginPath(); ctx.arc(cx,cy,phase*22*dpr,0,Math.PI*2); ctx.stroke();
              }
              ctx.fillStyle = `rgba(30,45,80,${0.18*alpha})`;
              ctx.beginPath(); ctx.arc(cx,cy,6*dpr,0,Math.PI*2); ctx.fill();
              ctx.shadowBlur = 10*dpr; ctx.shadowColor = `rgba(30,45,80,${alpha*0.5})`;
              ctx.fillStyle  = `rgba(10,15,30,${alpha*0.98})`;
              ctx.beginPath(); ctx.arc(cx,cy,2.8*dpr,0,Math.PI*2); ctx.fill();
              ctx.shadowBlur = 0;
              const lx = cx+10*dpr, ly = cy-7*dpr;
              if (labelClear(lx, ly)) {
                drawnLabelPos.push([lx,ly]);
                drawPillLabel(`Based out of ${node.name}`, lx, ly, alpha, true);
              }
            } else {
              ctx.shadowBlur = 8*dpr; ctx.shadowColor = `rgba(40,140,70,${alpha*0.5})`;
              ctx.fillStyle  = `rgba(25,110,55,${alpha})`;
              ctx.beginPath(); ctx.arc(cx,cy,2.5*dpr,0,Math.PI*2); ctx.fill();
              ctx.shadowBlur = 0;
              const lx = cx+8*dpr, ly = cy-5*dpr;
              if (labelClear(lx, ly)) {
                drawnLabelPos.push([lx,ly]);
                drawPillLabel(node.name, lx, ly, alpha, false);
              }
            }
          }

          requestAnimationFrame(draw);
        })();
      };
      img.src = LAND_B64;
    })();
  </script>
</body>
</html>
